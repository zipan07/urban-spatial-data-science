project:
  type: book
  output-dir: _site
  resources:
    - data/**

book:
  title: "数据科学与城市空间研究"
  subtitle: "方法、计算与规划应用"
  author:
    - "蔡子攀"
  date: today
  language: zh
  site-url: https://zipan07.github.io/urban-spatial-data-science/
  repo-url: https://github.com/zipan07/urban-spatial-data-science
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  reader-mode: true
  chapters:
    - index.qmd
    - contents.qmd
    - part: "数据目录与下载"
      chapters:
        - data.qmd
        - data-pages/nanjing-teaching.qmd
        - data-pages/ghsl-china-cities.qmd
        - data-pages/osm-nanjing-services.qmd
        - data-pages/large-open-data.qmd
    - part: "第一部分 城市问题、数据与研究设计"
      chapters:
        - 01-urban-informatics.qmd
        - 02-researchable-questions.qmd
        - 03-urban-data-paradigms.qmd
        - 04-urban-sensing-data-quality.qmd
        - 05-space-time-scale.qmd
    - part: "第二部分 计算工具与空间分析"
      chapters:
        - 06-computational-environment.qmd
        - 07-python-urban-data.qmd
        - 08-arcgis-spatial-analysis.qmd
        - 09-geographic-computation-mapping.qmd
    - part: "第三部分 空间关系、网络与智能模型"
      chapters:
        - 10-spatial-weights-autocorrelation.qmd
        - 11-urban-networks-accessibility.qmd
        - 12-machine-learning-spatial-intelligence.qmd
        - 13-model-evaluation-uncertainty.qmd
    - part: "第四部分 规划证据、设计应用与综合研究"
      chapters:
        - 14-evidence-planning-communication.qmd
        - 15-planning-design-case.qmd
        - 16-capstone-critique.qmd
    - references.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-line-numbers: true
    code-annotations: hover
    code-overflow: scroll
    smooth-scroll: true
    link-external-newwindow: true

execute:
  enabled: false
  warning: false
  message: false

bibliography: references.bib
lang: zh
