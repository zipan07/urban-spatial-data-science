name: Build eight-city course data

on:
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: "重新访问GHSL/OSM/SRTM来源，而非复用已发布裁剪"
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "scripts/build_china_city_cases.py"
      - "scripts/validate_china_city_cases.py"
      - "scripts/create_data_quality_notebook.py"
      - "scripts/verify_course_samples.py"
      - "data/china_city_cases/README.md"
      - "data/china_city_cases/LICENSES.md"
      - "data/china_city_cases/*/*_course_data.zip"
      - ".github/workflows/build-course-data.yml"

permissions:
  contents: write

concurrency:
  group: build-course-data
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data build dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy pandas pillow nbformat nbclient nbconvert ipykernel
          geopandas rasterio libpysal esda scikit-learn networkx matplotlib

      - name: Build eight-city teaching extracts
        env:
          COURSE_DATA_CACHE: ${{ runner.temp }}/course-data-cache
          COURSE_DATA_REFRESH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.refresh_sources == 'true' && '1' || '0' }}
        run: python scripts/build_china_city_cases.py

      - name: Preserve completed city ZIP caches after a partial build
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data/china_city_cases -mindepth 2 -maxdepth 2 -name '*_course_data.zip' -print0 | xargs -0 -r git add
          if [ -f data/china_city_cases/partial_build_report.json ]; then
            git add data/china_city_cases/partial_build_report.json
          fi
          if git diff --cached --quiet; then
            echo "No new city cache is available."
          else
            git commit -m "data: preserve completed city package caches"
            git push
          fi

      - name: Validate files, joins, raster metadata and checksums
        run: python scripts/validate_china_city_cases.py

      - name: Run representative chapter code and render GIS preview
        run: python scripts/verify_course_samples.py

      - name: Create and execute quality audit notebook
        run: |
          python scripts/create_data_quality_notebook.py
          jupyter nbconvert --to notebook --execute --inplace notebooks/00_china_city_data_quality.ipynb --ExecutePreprocessor.timeout=600

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-city-data-audit
          if-no-files-found: warn
          path: |
            data/china_city_cases
            notebooks/00_china_city_data_quality.ipynb

      - name: Commit generated course data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/china_city_cases notebooks/00_china_city_data_quality.ipynb
          if git diff --cached --quiet; then
            echo "Generated data are unchanged."
          else
            git commit -m "data: build eight-city course packages"
            git push
          fi
